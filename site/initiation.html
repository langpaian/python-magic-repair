<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>启蒙仪式 · 魔法维修铺</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="night">
  <div class="stars"></div>
  <main class="page">
    <nav class="topbar">
      <a class="brand" href="index.html">🔮 魔法维修铺</a>
      <div class="links">
        <a href="initiation.html">启蒙仪式</a>
        <a href="outcomes.html">学习成果</a>
        <a href="lore.html">法则图鉴</a>
      </div>
    </nav>
    <div id="app"><p class="subtitle">正在唤醒这台机器……（首次约需几秒）</p></div>
  </main>
  <footer class="foot">「机器不会撒谎，它只是比你诚实。」</footer>
</div>
<script src="js/app.js"></script>
<script src="js/editor.js"></script>
<script src="js/runner.js"></script>
<script>
App.ready().then((C) => {
  const esc = App.esc;
  const A = C.initiation.acts;

  function spirit(text) {
    return '<div class="spirit">老精灵：\n' + esc(text).replace(/\n/g, "\n") + "</div>";
  }

  let doneExp = new Set();

  function escH(s) {
    return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }
  function renderErr(text) {
    const lines = String(text).split("\n");
    let last = lines.length - 1;
    while (last >= 0 && lines[last].trim() === "") last--;
    return lines.map((l, i) => (i === last ? '<span class="err-key">' + escH(l) + "</span>" : escH(l))).join("\n");
  }

  // —— 施法动画（和任务卡一致：悬浮法阵 + 成功金爆/失败红震） ——
  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
  function spellStart() {
    const o = document.getElementById("spell-overlay");
    o.className = "spell-overlay magic-m1 attr-spirit";
    o.querySelector(".spell-label").textContent = "施放初级魔法…";
    o.hidden = false;
  }
  function spellResolve(ok) {
    const o = document.getElementById("spell-overlay");
    o.classList.add(ok ? "spell-success" : "spell-fail");
    o.querySelector(".spell-label").textContent = ok ? "成功" : "失败";
    setTimeout(() => { o.hidden = true; o.classList.remove("spell-success", "spell-fail"); }, 750);
  }

  document.getElementById("app").innerHTML =
    '<div class="initiation-page">'
    + '<h1 class="page-title">' + esc(C.initiation.title) + "</h1>"
    + '<section class="act" id="act1">'
    + "<h2>" + esc(A[0].title) + "</h2>"
    + '<p class="spirit-talk">' + esc(A[0].spirit_intro) + "</p>"
    + '<textarea id="act1-code" spellcheck="false">' + esc(A[0].preset_code) + "</textarea>"
    + '<div class="actions"><button class="btn btn-primary" onclick="castAct1()">🪄 施法</button></div>'
    + '<pre id="act1-console" class="console" hidden></pre>'
    + '<div id="act1-note" class="read-note" hidden></div>'
    + '<div id="act1-after" hidden></div>'
    + "</section>"
    + '<section class="act" id="act2" hidden>'
    + "<h2>" + esc(A[1].title) + "</h2>"
    + '<p class="spirit-talk">' + esc(A[1].spirit_intro) + "</p>"
    + '<div class="exp-row">' + A[1].experiments.map((e, i) => '<button class="btn btn-ghost" onclick="castAct2(' + i + ')">⚡ ' + esc(e.label) + "</button>").join("") + "</div>"
    + '<pre id="act2-console" class="console" hidden></pre>'
    + '<div id="act2-note" class="read-note" hidden></div>'
    + '<div id="act2-after" hidden></div>'
    + '<div id="act2-both" hidden></div>'
    + "</section>"
    + '<section class="act" id="read-error" hidden>'
    + "<h2>" + esc(C.initiation.read_error.title) + "</h2>"
    + '<p class="spirit-talk">' + esc(C.initiation.read_error.intro) + "</p>"
    + C.initiation.read_error.steps.map((s) => '<div class="code-note"><code class="note-name">' + esc(s.label) + '</code><p class="note-explain">' + esc(s.explain) + '</p></div>').join("")
    + '<p class="spirit-talk">' + esc(C.initiation.read_error.closing) + "</p>"
    + "</section>"
    + '<section class="act" id="primer" hidden>'
    + "<h2>" + esc(C.initiation.primer.title) + "</h2>"
    + '<p class="spirit-talk">' + esc(C.initiation.primer.intro) + "</p>"
    + C.initiation.primer.entries.map((item) => '<div class="code-note"><pre class="note-code">' + esc(item.code) + '</pre><p class="note-explain">' + esc(item.explain) + '</p></div>').join("")
    + '<p class="spirit-talk">' + esc(C.initiation.primer.closing) + "</p>"
    + "</section>"
    + '<section class="act" id="act3" hidden>'
    + "<h2>" + esc(A[2].title) + "</h2>"
    + '<p class="spirit-talk">' + esc(A[2].spirit_intro) + "</p>"
    + '<a class="btn btn-primary" href="ticket.html?fault=' + A[2].next_ticket + '">🔧 接下第一单</a>'
    + "</section>"
    + '<div id="spell-overlay" class="spell-overlay magic-m1 attr-spirit" hidden>'
    + '<div class="spell-float">'
    + '<div class="spell-circle"><div class="spell-ring"></div><div class="spell-ring spell-ring2"></div><div class="spell-ring3"></div><div class="spell-orbit"><span class="p p1"></span><span class="p p2"></span><span class="p p3"></span></div><div class="spell-core"></div><div class="spell-burst"></div></div>'
    + '<div class="spell-label">施放初级魔法…</div>'
    + "</div>"
    + "</div>"
    + "</div>";

  // 预热魔法引擎
  Runner.init().then(() => {
    const st = document.getElementById("engine-state");
    if (st) st.textContent = "机器已待命";
  });

  window.castAct1 = async () => {
    spellStart();
    const code = document.getElementById("act1-code").value;
    const [r] = await Promise.all([Runner.run(code), sleep(1000)]);
    spellResolve(r.ok);
    const c = document.getElementById("act1-console");
    c.hidden = false;
    if (r.ok) {
      c.textContent = r.stdout || "（什么也没发生）";
      c.classList.remove("err"); c.classList.add("ok");
      const note = document.getElementById("act1-note");
      note.hidden = false;
      note.textContent = "↑ 这里就是「机器的回应」——以后每次施法，都先看这里。";
    } else {
      c.innerHTML = renderErr(r.stderr || "");
      c.classList.remove("ok"); c.classList.add("err");
    }
    if (r.ok) {
      document.getElementById("act1-after").hidden = false;
      document.getElementById("act1-after").innerHTML = spirit(A[0].spirit_after);
      document.getElementById("act2").hidden = false;
      document.getElementById("act2").scrollIntoView({ behavior: "smooth" });
    }
  };

  window.castAct2 = async (i) => {
    spellStart();
    const [r] = await Promise.all([Runner.run(A[1].experiments[i].code), sleep(1000)]);
    spellResolve(r.ok);
    const c = document.getElementById("act2-console");
    c.hidden = false;
    if (r.ok) {
      c.textContent = r.stdout || "";
      c.classList.remove("err"); c.classList.add("ok");
    } else {
      c.innerHTML = renderErr(r.stderr || "");
      c.classList.remove("ok"); c.classList.add("err");
      const note = document.getElementById("act2-note");
      note.hidden = false;
      note.textContent = "↑ 从最后一行读起 —— 高亮那行就是机器亲口说的重点";
      if (!window.__readErrSeen) {
        window.__readErrSeen = true;
        const re = document.getElementById("read-error");
        re.hidden = false;
        re.scrollIntoView({ behavior: "smooth" });
      }
    }
    document.getElementById("act2-after").hidden = false;
    document.getElementById("act2-after").innerHTML = spirit(A[1].experiments[i].spirit_after);
    doneExp.add(i);
    if (doneExp.size >= 2) {
      document.getElementById("act2-both").hidden = false;
      document.getElementById("act2-both").innerHTML = spirit(A[1].spirit_after_both);
      document.getElementById("primer").hidden = false;
      document.getElementById("act3").hidden = false;
      document.getElementById("primer").scrollIntoView({ behavior: "smooth" });
    }
  };
});
</script>
</body>
</html>
