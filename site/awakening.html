<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>觉醒 · 创造之权 · 魔法维修铺</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="night">
  <div class="stars"></div>
  <main class="page">
    <nav class="topbar">
      <a class="brand" href="index.html">🔮 魔法维修铺</a>
      <div class="links">
        <a href="initiation.html">启蒙仪式</a>
        <a href="outcomes.html">学习成果</a>
        <a href="lore.html">法则图鉴</a>
      </div>
    </nav>
    <div id="app"><p class="subtitle">正在点灯……</p></div>
  </main>
  <footer class="foot">「机器不会撒谎，它只是比你诚实。」</footer>
</div>
<script src="js/app.js"></script>
<script src="js/editor.js"></script>
<script src="js/runner.js"></script>
<script>
App.ready().then((C) => {
  const esc = App.esc;
  const E = C.ending;
  const total = C.faults.length;
  const solved = App.solvedList();
  const allDone = solved.length === total && total > 0;

  if (!allDone) {
    const next = C.faults.find((f) => !App.isSolved(f.id));
    document.getElementById("app").innerHTML =
      '<div class="awakening-page">'
      + '<h1 class="page-title">觉醒 · 创造之权</h1>'
      + '<div class="act"><p class="spirit-talk">毕业证，只发给把这一批机器都修好的人。你还有任务单没化解。</p>'
      + '<div class="actions">'
      + (next ? '<a class="btn btn-primary" href="ticket.html?fault=' + next.id + '">去修这一单 →</a>' : "")
      + '<a class="btn btn-ghost" href="index.html">回大厅</a>'
      + "</div></div></div>";
    return;
  }

  const solvedLaws = C.faults.filter((f) => App.isSolved(f.id)).map((f) => f.law);

  document.getElementById("app").innerHTML =
    '<div class="awakening-page">'
    + '<h1 class="page-title">' + esc(E.title) + "</h1>"
    + '<div class="epilogue spirit">' + E.epilogue.map((p) => "<p>" + esc(p) + "</p>").join("") + "</div>"
    + '<section class="act">'
    + "<h2>🪄 自由施法场</h2>"
    + '<p class="hint">' + esc(E.free_cast.hint) + "</p>"
    + '<textarea id="cast-code" spellcheck="false">' + esc(E.free_cast.placeholder) + "</textarea>"
    + '<div class="actions"><button class="btn btn-primary" onclick="castSpell()">' + esc(E.free_cast.button) + "</button></div>"
    + '<pre id="cast-console" class="console" hidden></pre>'
    + '<div id="cast-spirit" class="spirit" hidden></div>'
    + "</section>"
    + '<section class="act certificate">'
    + "<h2>🎓 " + esc(E.certificate.title) + "</h2>"
    + '<div id="cert"></div>'
    + "</section>"
    + "</div>";

  document.getElementById("cert").innerHTML = App.certSVG(solvedLaws);

  Runner.init();

  window.castSpell = async () => {
    const c = document.getElementById("cast-console");
    c.hidden = false;
    c.textContent = "（正在唤醒机器……）";
    const r = await Runner.run(document.getElementById("cast-code").value);
    c.textContent = r.stdout || r.stderr || "(什么也没发生)";
    c.classList.toggle("ok", r.ok);
    const s = document.getElementById("cast-spirit");
    s.hidden = false;
    s.textContent = "老精灵：\n" + (r.ok ? E.free_cast.success_lines.join("\n") : E.free_cast.failure_line);
  };
});
</script>
</body>
</html>
