# 法则分类学 —— 这个世界的自然法则（隐形的课程表）
laws:
  - id: zero-division
    name: 零的禁忌
    error: ZeroDivisionError
    stage: 新手法师
    statement: "除法不接受零的拜访——机器不猜测，它如实拒绝。"
    adult_note: "ZeroDivisionError 从不说谎。当你说'除以零'，它就真的除以零。初学者觉得它坏，工程师知道那是忠诚。"

  - id: room-number
    name: 房间号必须存在
    error: IndexError
    stage: 新手法师
    statement: "序列是严谨的房间号——机器不替你脑补，房间不存在它就如实告诉你。"
    adult_note: "IndexError 是机器在说：'你给的地址，没有这个房间。'它不会替你猜你想要哪个。"

  - id: name-whisper
    name: 名字必须先被念过
    error: NameError
    stage: 新手法师
    statement: "咒语里用到的名字，必须先被定义——机器不猜。"
    adult_note: "NameError 是机器在说：'这个名字，你从没教过我。'变量的定义，就是念出它的名字。"

  - id: type-order
    name: 万物分门别类
    error: TypeError
    stage: 新手法师
    statement: "数字和文字是两种东西——机器不假装它们能结婚。"
    adult_note: "TypeError 是机器在说：'你给我的东西，不是我要的那一种。'字符串 + 整数，它不会替你悄悄转换。要用 str() 或 f-string 把话说清楚。"

  - id: key-exists
    name: 钥匙要存在
    error: KeyError
    stage: 新手法师
    statement: "宝箱要有钥匙才能开——机器不猜哪把钥匙是你要的。"
    adult_note: "KeyError 是机器在说：'这把钥匙，打不开这个宝箱。'字典里没有的键，别直接下标硬闯，用 .get(key, 默认值) 给条后路。"

  - id: indent-skeleton
    name: 缩进是咒语的骨架
    error: IndentationError
    stage: 新手法师
    statement: "机器的世界没有'差不多'——缩进差一格，意思就变。"
    adult_note: "IndentationError 是机器在说：'你的咒语骨架断了。'在 Python 里，缩进不是排版，是结构本身。"

  - id: method-not-spell
    name: 方法不是咒语本身
    error: TypeError
    stage: 见习维修师
    statement: "调用的方法做完事就走了，它不把结果塞回你手里。"
    adult_note: "list.append() 会修改列表并返回 None。写 bag = shopping.append(x)，bag 就成了 None。方法做事，但不回头。"

  - id: birth-memory
    name: 记忆只存在于诞生的那一刻
    error: ""
    stage: 熟练维修师
    statement: "你以为的'每次'，对机器是'唯一的一次'——默认值只在出生时被记住一次。"
    adult_note: "可变对象做默认参数是最著名的陷阱：def f(x, lst=[])，那个 [] 只创建一次，之后每次调用都共用它。标准解法：默认值用 None，函数里再新建。"

  - id: wall-law
    name: 墙的法则
    error: UnboundLocalError
    stage: 见习维修师
    statement: "咒语看不见墙外的变量——机器只忠于它所在的那一层。"
    adult_note: "在函数里给变量赋值，Python 就认为它是'墙内'局部变量，于是赋值前引用它就报 UnboundLocalError。想改全局要声明 global。"

  - id: same-value
    name: 相不相同要看值
    error: ""
    stage: 见习维修师
    statement: "`==` 看值相不相同，`is` 看是不是同一个——机器从不把两者混淆，你却会。"
    adult_note: "对列表这类可变对象，is 几乎总是 False，因为它问的是'是不是同一个对象'。比较内容用 ==，is 只该用于 None 或单例。"

  - id: tag-first
    name: 标签要先贴好
    error: NameError
    stage: 新手法师
    statement: "用到的名字，先写好标签（赋值），机器才认。"
    adult_note: "NameError 是机器在说：'这个名字，你从没教过我。'变量拼写要前后一致——写岔一个字母，它当你是另一个人。"

  - id: spell-complete
    name: 咒语必须念完整
    error: SyntaxError
    stage: 新手法师
    statement: "括号和引号要成双成对——念到一半的咒语不生效。"
    adult_note: "SyntaxError 是机器在说：'这句话我没法读。'多半是少了右括号或引号，机器不会替你补。"

  - id: count-in-sentence
    name: 数量要能写进话里
    error: TypeError
    stage: 新手法师
    statement: "数字要写进句子里，先 str() 转成文字。"
    adult_note: "字符串和整数不能直接拼。str() 或 f-string，就是那道'把数字变成文字'的咒语。"

  - id: truth-speakable
    name: 真伪也能被念出
    error: TypeError
    stage: 新手法师
    statement: "True/False 也是材料——拼进句子也要转成文字，或用逗号分开打印。"
    adult_note: "布尔值是一种类型。print 里直接用逗号传多个参数，就不必硬拼成字符串。"

  - id: recipe-math
    name: 合成要按配方
    error: ""
    stage: 见习维修师
    statement: "魔力值按配方算——加法还是乘法，机器照着来。"
    adult_note: "先想清楚运算语义再写符号。1 + 2 写成了 1 * 2，机器不会提醒你配方错了。"

  - id: arrow-compare
    name: 谁多谁少要看箭头
    error: ""
    stage: 见习维修师
    statement: "> 和 < 是指向多的一边的箭头，别指反。"
    adult_note: "比较运算符的开口朝向较大的数。这是最容易被忽略的'看着对、实际反'的错。"

  - id: whole-and-remainder
    name: 整份和零头要分开
    error: ""
    stage: 见习维修师
    statement: "// 是整份，% 是零头，分材料别混。"
    adult_note: "7 // 2 = 3、7 % 2 = 1。两个运算符服务不同的问题，用混了答案就差得远。"

  - id: condition-straight
    name: 条件要对着想
    error: ""
    stage: 熟练维修师
    statement: "if 的条件为真才走里面——把话说对。"
    adult_note: "if rainy == False 在真的下雨时反而走 else。条件要对着你的意图写，别绕一个弯。"

  - id: count-right
    name: 数数别多数少数
    error: ""
    stage: 熟练维修师
    statement: "range(起点, 终点) 不含终点——数药水别多数少数。"
    adult_note: "range(1, 3) 是 1、2 两个数。要 1、2、3，终点得写 4。off-by-one 是真实世界里最多见的循环错误。"

  - id: step-by-step
    name: 搅拌要一步步来
    error: ""
    stage: 熟练维修师
    statement: "循环要记得让变量前进，一步一个脚印。"
    adult_note: "while 里不推进变量会死循环；推进太快（一次 +2）会少跑。步长要正好一步。"
