# 启蒙仪式 —— 纯体验、零讲解。三段微型实验，精灵只在正确的时刻点破。
title: 启蒙仪式
acts:
  - key: act1
    title: 第一幕 · 你会施法了
    spirit_intro: |
      你推开门，一盏昏黄的灯亮起来。柜台后，一只老精灵抬起头：
      "来修东西的？……不着急。先回答我一个问题：
       你想不想知道，魔法是怎么开始的？"
      "喏，这支魔法羽毛笔给你。写一句话，让这台机器念出你的名字。把你的名字放进引号里。"
    preset_code: 'print("你的名字")'
    spirit_after: |
      "看到没有。世界听你的话。"
      "这就是魔法的开始——不是念咒语，是你说的每一个字，都会成真。"

  - key: act2
    title: 第二幕 · 它会说实话
    spirit_intro: |
      "现在，做一件我在这个行当里最珍视的事——故意惹它生气。"
      "让它做一件它做不到的事。下面两句，随便点哪句都行。"
    experiments:
      - label: 让两个词做乘法
        code: 'print("你的名字" * "魔法")'
        spirit_after: |
          "它不是坏掉了。它在很诚实地告诉你：'这件事我做不了。'"
          "你看——机器从不假装，它不会编个借口糊弄你。"
      - label: 让它除以零
        code: "1 / 0"
        spirit_after: |
          "它甚至不找借口。除数是零，它就说除数是零。"
          "一个字都不骗你。"
    spirit_after_both: |
      "记住这个感觉。在这个世界上，你很难再找到比它更诚实的对话对象了。"
      "而我们这个行当要做的，就是听懂它说的每一句真话。"

  - key: act3
    title: 第三幕 · 你能修好它
    spirit_intro: |
      "好。你见过它听话，也听过它说真话。"
      "那现在——第一单生意，来了。"
      "有一位客人，她的保温咒坏了。去听听，机器在说什么。"
    next_ticket: 001
