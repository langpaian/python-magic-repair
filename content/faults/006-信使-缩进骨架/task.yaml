id: '006'
title: 魔法信使一开口就说不出带不带伞
customer: 魔法信使
law: 缩进是咒语的骨架
law_statement: 机器说'这里该缩进却没有'的时候，看看你的 if/def 后面的代码，是不是忘了往后退一格。
difficulty: 2
category: syntax
expected_error: IndentationError
learn:
  topic: 缩进 · 基础语法
  url: https://www.runoob.com/python3/python3-basic-syntax.html
  note: Python 用缩进表示结构。def 和 if 下面的代码要整体往后退一格——机器把缩进当语法，不是排版。
