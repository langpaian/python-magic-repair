# 觉醒 · 创造之权 —— 三部曲第三幕的小结尾
title: 觉醒 · 创造之权

epilogue:
  - "你还记得吗？第一天，你连魔法是什么都不知道。"
  - "现在你知道了：机器从不撒谎，它只是比你诚实。而你——学会了听。"
  - "你修好了三台机器，听懂了三条真话：零的禁忌、房间号必须存在、名字必须先被念过。"
  - "那就够了。从今天起，你不只是修别人的咒语了。"
  - "来。写下你自己的第一道咒语。"

free_cast:
  hint: "想写什么都可以。让机器念点什么、算点什么、造点什么。"
  placeholder: |-
    # 写点什么，让世界动起来
    words = "你的魔法"
    print(words * 3)
  button: "✨ 施放你的咒语"
  success_lines:
    - "看见了吗？这是你写的。"
    - "从今天起，世界多了一种可能——而它来自你。"
  failure_line: "没关系，机器只是在说实话。读读它，再改改——你已经是老手了。"

certificate:
  title: "魔法维修师之证"
